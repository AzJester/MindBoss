name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run icons
      - name: Confirm generated icons are reproducible
        run: git diff --exit-code -- public extension
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate:local
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run extension:package
      - uses: actions/upload-artifact@v4
        with:
          name: mindboss-clipper
          path: artifacts/mindboss-clipper-*.zip
          if-no-files-found: error
          retention-days: 30
