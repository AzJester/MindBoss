name: Release extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run extension:package
      - name: Verify tag matches extension version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./extension/manifest.json').version")"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/mindboss-clipper-*.zip --generate-notes --verify-tag
