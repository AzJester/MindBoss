name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindboss-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Record D1 recovery bookmark
        run: npx wrangler d1 time-travel info mindboss-production --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --json > d1-recovery-bookmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: d1-recovery-bookmark
          path: d1-recovery-bookmark.json
          retention-days: 30
      - run: npx wrangler d1 migrations apply mindboss-production --remote --config wrangler.reminders.toml
      - run: npx wrangler pages deploy dist --project-name mindboss --branch main
      - run: npx wrangler deploy --config wrangler.reminders.toml
      - run: curl --fail --retry 6 --retry-delay 10 https://mindboss.st-dba.com/api/v1/health
